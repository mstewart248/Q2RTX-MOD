// q3dm19 (Apocalypse Void), after maps/quake3.cfg. mapcvar: the player's own
// value comes back on the next map.
//
// Matt, 2026-11-25: the rotating space sky of Quake II's boss2 instead of the
// map's own, as on q3tourney1, q3dm10, q3dm16 and q3dm18. boss2's worldspawn is
// "sky" "space1", "skyrotate" "3", "skyaxis" "1 1 0", and Q2RTX's maps/boss2.cfg
// turns on the space sky (physical_sky_space: the starfield with the planet
// drawn in). That sky brings its own sun, so the Quake III sky's q3map_sun and
// the pt_q3_sun_* settings do not apply here. sky_override "" goes back to the
// map's own sky.
mapcvar sky_override space1
mapcvar sky_override_rotate 3
mapcvar sky_override_axis "1 1 0"
mapcvar physical_sky_space 1
