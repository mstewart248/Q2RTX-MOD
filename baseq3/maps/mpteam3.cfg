// mpteam3 (Inner Sanctums, Team Arena), after maps/quake3.cfg. mapcvar: the
// player's own value comes back on the next map.
//
// Matt, 2026-11-26: "can we have mpteam3 map use the quake2 rotating space sky
// for a skybox when the rerelease environment is set" - the rotating space sky
// of Quake II's boss2 instead of the map's own, as on q3tourney1, q3dm10,
// q3dm16, q3dm18, q3dm19 and q3tourney6, but ONLY in the environment menu's
// "rerelease" sky type (sky_type 0). Any other sky type is the player asking for
// one particular sky everywhere, so the map keeps out of it (as q64/outpost.cfg
// does). boss2's worldspawn is "sky" "space1", "skyrotate" "3", "skyaxis"
// "1 1 0", and Q2RTX's maps/boss2.cfg turns on the space sky
// (physical_sky_space: the starfield with the planet drawn in). That sky brings
// its own sun, so the Quake III sky's q3map_sun and the pt_q3_sun_* settings do
// not apply here. sky_override "" goes back to the map's own sky.
//
// One "if" per line: a ";" would end the if, not the branch. The test is made
// when the map loads, so changing the sky type while on this map takes effect
// on the next load of it.
if $sky_type == 0 then mapcvar sky_override space1
if $sky_type == 0 then mapcvar sky_override_rotate 3
if $sky_type == 0 then mapcvar sky_override_axis "1 1 0"
if $sky_type == 0 then mapcvar physical_sky_space 1
