// q3dm17 (The Longest Yard), after maps/quake3.cfg. mapcvar: the player's own
// value comes back on the next map.
//
// Matt, 2026-11-17: Earth's sky instead of the black void, the sun still up but
// on its way down, setting while you play - "as the sun goes down it starts to
// look like the original map". At 2x.
//
// Elevation 155 is the animation's parameter, not an angle: past 90 is the
// setting side, so this is 25 degrees up and falling (physical_sky.c,
// sun_preset_day_start). Azimuth 85 shows as 265 there.
//
// Matt, 2026-11-18: the sun was on the wrong side for the map (azimuth 10, shown
// as 190 - the Evening preset's). He circled where it should go instead and set
// the azimuth to 85. Left is +azimuth: sun = (cos az, sin az) like a yaw. Nudge it
// live with "sun_azimuth <n>" (sky type rerelease), then copy the value here.
// At 2x the sun drops about 8 degrees a minute: sunset ~3 minutes in, full dark
// ~5 minutes, then ~21 minutes of night before dawn comes round.
//
// The sky and the hour are the map's to choose in the "rerelease" sky type only.
// With Earth or Stroggos picked in the menu, the time of day picked there is
// where the cycle starts instead. The speed applies either way.
mapcvar use_procedural_sky earth
mapcvar sky_map_sun_elevation 155
mapcvar sky_map_sun_azimuth 85
mapcvar sky_map_sun_animate 2
mapcvar sun_animate 2
