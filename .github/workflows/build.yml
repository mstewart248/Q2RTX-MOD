name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # A run by hand from the Actions tab ("Run workflow").
  workflow_dispatch:
  
env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Setup variables
      uses: actions/github-script@v6
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true
        # full history, so the tags are there for the version (cmake/mod_version.cmake)
        fetch-depth: 0
      
    # The DLSS headers and the x64 import library are not vendored in this
    # repository, so the SDK is cloned and DLSS_SDK2_PATH is pointed at it.
    # Without this, configure failed outright with a FATAL_ERROR.
    - name: Checkout NVIDIA DLSS SDK
      uses: actions/checkout@v3
      with:
        repository: NVIDIA/DLSS
        path: DLSS_SDK

    # phonon.dll, the Steam Audio runtime, built from source WITHOUT Intel
    # IPP: Valve's prebuilt DLL links IPP and oneMKL, which cannot ship with a
    # GPL program (setup/build_phonon.py has the whole story, and
    # package_release.py refuses that DLL). Building it takes several
    # minutes, so the finished DLL is cached against the script, which pins
    # every source archive by hash. It runs before Configure because it also
    # writes extern/steamaudio/include when those headers are not committed.
    - name: Cache Steam Audio runtime
      id: phonon
      uses: actions/cache@v4
      with:
        path: |
          phonon.dll
          extern/steamaudio/include
        key: phonon-win64-${{ hashFiles('setup/build_phonon.py') }}

    - name: Build Steam Audio runtime
      if: steps.phonon.outputs.cache-hit != 'true'
      run: python setup/build_phonon.py

    # nvflow.dll and nvflowext.dll, the NVIDIA Flow 2 runtime behind the
    # simulated fire and smoke (BSD-3-Clause), built from NVIDIA's source by
    # setup/build_flow.py, which pins the source commit and the Slang
    # compiler. Cached against the script and its CMake project. It runs
    # before Configure because CMake only compiles Flow in (USE_FLOW) when
    # extern/flow/include is there, and the script writes it when it is not.
    - name: Cache NVIDIA Flow runtime
      id: flow
      uses: actions/cache@v4
      with:
        path: |
          nvflow.dll
          nvflowext.dll
          extern/flow/include
          extern/flow/LICENSE.md
        key: flow-win64-${{ hashFiles('setup/build_flow.py', 'setup/flow/**') }}

    - name: Build NVIDIA Flow runtime
      if: steps.flow.outputs.cache-hit != 'true'
      run: python setup/build_flow.py

    - name: Configure Win64
      env:
        DLSS_SDK2_PATH: ${{github.workspace}}/DLSS_SDK
      run: cmake -B ${{github.workspace}}/build-x64 -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCONFIG_BUILD_GLSLANG=ON

    - name: Configure Win32
      # Win32 produces the dedicated server only, and the DLSS SDK ships no
      # 32-bit library - so the path tracer, which is what pulls in DLSS.c,
      # is left out of this configuration.
      run: cmake -B ${{github.workspace}}/build-win32 -A Win32 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCONFIG_BUILD_GLSLANG=OFF -DCONFIG_VKPT_RENDERER=OFF -DCONFIG_USE_DLSS=OFF

    - name: Build Game for Win64
      env:
        DLSS_SDK2_PATH: ${{github.workspace}}/DLSS_SDK
      run: cmake --build ${{github.workspace}}/build-x64 --config ${{env.BUILD_TYPE}}

    - name: Build Dedicated Server for Win32
      run: cmake --build ${{github.workspace}}/build-win32 --config ${{env.BUILD_TYPE}}


    # THE SHIPPED MEDIA, WITHOUT WHICH THE ARTIFACT DOES NOT RUN.
    #
    # The Upload step below takes baseq2/ and rerelease/ straight out of the
    # checkout, so anything not committed is simply absent from the build. Two
    # required files can never be committed:
    #
    #   baseq2/q2rtx_media.pkz   862 MB - over GitHub's 100 MB per-file limit
    #   baseq2/blue_noise.pkz     97 MB - under it, but LFS-sized and metered
    #
    # They cannot be rebuilt from this repo either: baseq2/env, models,
    # overrides, sprites and textures are all empty here, so that pkz is the only
    # copy of the content. And they never change - both are stock 2020 files.
    #
    # So they live as assets on a Release in this repo, which allows 2 GB per
    # file, does not count against repo size, and is not metered like LFS.
    #
    # THE RELEASE THIS PULLS FROM MUST EXIST, or every build fails here with
    # "release not found" - which is what happened when it was deleted on
    # 2026-09-18. It is a PRE-RELEASE, so it never appears as the repository's
    # Latest release and cannot be mistaken for a playable build.
    #
    # To recreate it, from a tree that has the two files:
    #
    #   gh release create shipped-media --prerelease \
    #      --title "Shipped media (CI fixture - not a game release)" \
    #      --notes "Static Quake II RTX data for CI builds." \
    #      baseq2/q2rtx_media.pkz baseq2/blue_noise.pkz
    #
    # Deleting a GitHub release leaves its TAG behind, so recreating it against
    # the existing shipped-media tag is enough - no new tag is needed.
    - name: Fetch shipped media
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download shipped-media --repo ${{ github.repository }} --pattern '*.pkz' --dir baseq2 --clobber

    # Fail here rather than uploading a build that looks fine and cannot start.
    - name: Verify shipped media
      shell: bash
      run: |
        missing=0
        for f in baseq2/q2rtx_media.pkz baseq2/blue_noise.pkz phonon.dll nvflow.dll nvflowext.dll; do
          if [ -s "$f" ]; then
            echo "ok   $f ($(du -h "$f" | cut -f1))"
          else
            echo "MISSING $f"; missing=1
          fi
        done
        test -d baseq2/shader_vkpt || { echo "MISSING baseq2/shader_vkpt"; missing=1; }
        exit $missing

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: q2rtx-windows-${{env.GITHUB_SHA_SHORT}}
        path: |
          q2rtx.exe
          q2rtxded.exe
          q2rtxded-x86.exe
          phonon.dll
          nvflow.dll
          nvflowext.dll
          extern/steamaudio/LICENSE.md
          extern/steamaudio/THIRDPARTY.md
          extern/flow/LICENSE.md
          baseq2/
          rerelease/
          rogue/
          license.txt
          notice.txt

  # Built in the Steam Runtime (soldier: gcc 8, cmake 3.18) so the binaries run
  # on any distribution Steam does. It was switched off from 2026-08 to 2026-10
  # while it failed; what broke it was MSVC-only code - the same global defined
  # in two files, Win32-only Vulkan extensions, headers MSVC includes for you.
  # DLSS is built here too: the SDK ships a Linux NGX library and runtimes.
  build-linux-x64:
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/soldier/sdk:latest

    steps:
    - name: Setup variables
      uses: actions/github-script@v6
      with:
        script: core.exportVariable('GITHUB_SHA_SHORT', context.sha.substring(0, 7))

    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        submodules: true
        # full history, so the tags are there for the version (cmake/mod_version.cmake)
        fetch-depth: 0

    - name: Checkout NVIDIA DLSS SDK
      uses: actions/checkout@v3
      with:
        repository: NVIDIA/DLSS
        path: DLSS_SDK

    - name: Configure
      env:
        DLSS_SDK2_PATH: ${{github.workspace}}/DLSS_SDK
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCONFIG_BUILD_GLSLANG=ON

    - name: Build Game
      env:
        DLSS_SDK2_PATH: ${{github.workspace}}/DLSS_SDK
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} -j2

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: q2rtx-linux-x64-${{env.GITHUB_SHA_SHORT}}
        path: |
          q2rtx
          q2rtxded
          baseq2/
          rerelease/
          rogue/
          license.txt
          notice.txt
