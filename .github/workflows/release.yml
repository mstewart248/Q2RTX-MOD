name: Release

# Builds a complete, playable package and publishes it as a GitHub release.
#
# WHY THIS EXISTS RATHER THAN UPLOADING A PACKAGE BY HAND. Everything the
# release needs is already on GitHub - the authored content is in this
# repository and the stock media is an asset on the `shipped-media` release - so
# assembling it here costs no upload from a workstation and, more importantly,
# ties the artifact to a tagged commit instead of to whatever happened to be in
# someone's working tree.
#
# Trigger it either by pushing a tag:
#
#     git tag v1.1.0 && git push origin v1.1.0
#
# or from the Actions tab with "Run workflow", giving the tag name. A tag that
# does not exist yet is created on the commit the workflow runs against.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (created on this commit if it does not exist)'
        required: true
        type: string
      draft:
        description: 'Publish as a draft'
        required: false
        default: false
        type: boolean

env:
  BUILD_TYPE: Release

jobs:
  package-windows:
    runs-on: windows-latest

    # Needed for `gh release create` / `upload` with the built-in token.
    permissions:
      contents: write

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          # The packaging script uses `git ls-files` as its manifest, so it needs
          # a real checkout rather than a filtered one.
          fetch-depth: 0

      - name: Checkout NVIDIA DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          path: DLSS_SDK

      - name: Configure Win64
        env:
          DLSS_SDK2_PATH: ${{ github.workspace }}/DLSS_SDK
        run: cmake -B ${{ github.workspace }}/build-x64 -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCONFIG_BUILD_GLSLANG=ON

      - name: Build Win64
        env:
          DLSS_SDK2_PATH: ${{ github.workspace }}/DLSS_SDK
        run: cmake --build ${{ github.workspace }}/build-x64 --config ${{ env.BUILD_TYPE }}

      # Win32 produces the dedicated server only; the DLSS SDK ships no 32-bit
      # library, so the path tracer is left out of this configuration.
      - name: Configure Win32
        run: cmake -B ${{ github.workspace }}/build-win32 -A Win32 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCONFIG_BUILD_GLSLANG=OFF -DCONFIG_VKPT_RENDERER=OFF -DCONFIG_USE_DLSS=OFF

      - name: Build Win32 dedicated server
        run: cmake --build ${{ github.workspace }}/build-win32 --config ${{ env.BUILD_TYPE }}

      # q2rtx_media.pkz (861 MiB) and blue_noise.pkz (96 MiB) are stock Quake II
      # RTX data. They are over, or near, GitHub's 100 MB per-file limit and
      # cannot be rebuilt from this repository, so they live as assets on the
      # `shipped-media` release. See the note in build.yml.
      - name: Fetch shipped media
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download shipped-media --repo ${{ github.repository }} --pattern '*.pkz' --dir baseq2 --clobber

      - name: Verify inputs
        shell: bash
        run: |
          fail=0
          for f in q2rtx.exe q2rtxded.exe baseq2/gamex86_64.dll \
                   baseq2/q2rtx_media.pkz baseq2/blue_noise.pkz baseq2/shaders.pkz; do
            if [ -s "$f" ]; then echo "ok   $f ($(du -h "$f" | cut -f1))"
            else echo "MISSING $f"; fail=1; fi
          done
          test -d baseq2/shader_vkpt || { echo "MISSING baseq2/shader_vkpt"; fail=1; }
          exit $fail

      - name: Assemble package
        shell: bash
        run: |
          python setup/package_release.py \
            --out "Q2RTX-Overdrive-${{ steps.tag.outputs.name }}-win64.zip" \
            --dlss-dir DLSS_SDK/lib/Windows_x86_64/rel

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          ASSET="Q2RTX-Overdrive-$TAG-win64.zip"
          DRAFT=""
          if [ "${{ github.event.inputs.draft }}" = "true" ]; then DRAFT="--draft"; fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists - replacing the asset"
            gh release upload "$TAG" "$ASSET" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Quake II RTX Overdrive $TAG" \
              --notes "Complete package built from \`${{ github.sha }}\`. Extract it and add your own Quake II pak files - see README-FIRST.txt inside the archive. Game data is not included and cannot be redistributed." \
              $DRAFT
          fi
