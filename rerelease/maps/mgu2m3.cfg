// Stroggos at dusk: the procedural Stroggos sky in place of the map's skybox,
// with the sun where the "dusk" time of day puts it (sun_preset 8:
// physical_sky.c SUN_PRESET_DUSK, -6 elevation, 205 azimuth) - just under the
// horizon. Only in the "rerelease" sky type; any other sky type the player picks
// overrules the map. To aim it live: sun_elevation / sun_azimuth in the console,
// then copy the values here.
mapcvar use_procedural_sky stroggos
mapcvar sky_map_sun_elevation -6
mapcvar sky_map_sun_azimuth 205
