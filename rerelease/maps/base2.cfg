mapcvar sky_map_sun_elevation -5
mapcvar sky_map_sun_azimuth 285

// Fog brightness for this map - the five fog-menu knobs, overriding the
// player's own for this map only. Converted from the old cl_fog_scale /
// cl_volumetric_fog_density recipe so the map keeps the look it was tuned to;
// see the conversion note in src/client/mapfog.c. Fog on/off stays the player's.
mapcvar pt_fog_scale_sun 5.2
mapcvar pt_fog_scale_skybox 1.1
mapcvar pt_fog_scale_emissive 1.1
mapcvar pt_fog_scale_dynamic 1.1
mapcvar pt_fog_scale_model 1.1
mapcvar cl_dynamic_lights 0
mapcvar use_procedural_sky stroggos
// GOD RAYS COST. Matt, 2026-09-08: "the god rays calculation is going up to 8ms
// ... when I am looking at more of the sky?" - 8.88 ms peak of a 16.76 ms frame,
// and he had the cause right. The march runs camera -> surface and A SKY PIXEL
// HAS NO SURFACE, so sky is the longest possible ray and the worst case for this
// pass by 10-30x over a ray that stops at a near wall.
//
// (It used to be worse: the old cl_fog_scale 300 was multiplied into the density
// getStep reads, pinning it at its 1-unit floor. Densities are normalised now and
// brightness lives in the knobs above, so that coupling is gone.)
//
// pt_fog_step is the knob that costs nothing in appearance: it multiplies the
// step directly, and the march is a Riemann sum - each accumulation is
// stepLength-weighted and throughput decays by exp(-stepLength * density *
// sigma) - so 8x fewer samples are 8x heavier each and the integral holds.
// Brightness and colour are preserved; what coarsens is shadow-shaft edge
// sharpness and jitter, which god_rays_filter already smooths.
//
// Tune it live - it updates per frame and mapcvar does not archive, so
// "pt_fog_step 4" or "pt_fog_step 16" in the console is a free A/B against the
// god rays line with cl_blood_stats' neighbour, the profiler.
mapcvar pt_fog_step 8

// ---------------------------------------------------------------------------
// PER-ENTRANCE SECTIONS.  base2 is entered twice: forwards out of base1, and
// again coming back up out of base3.  A "spawnpoint" line gates everything
// BELOW it on which of those it was, so shared settings go above the first one
// and each section runs to the end of the file or the next "spawnpoint".
//
// The names come from the maps themselves: base1 ends with
// target_changelevel "map base2$base1", and base3 with "map base2$base3b".
// The engine prints the one in use at map load - spawnpoint "base3b" - and
// typing "spawnpoint" on its own in the console prints it too.
//
// A cvar set in ONE section only keeps whatever the player had in the others,
// so give anything a section overrides a default up above, as the sun angle
// has.  "spawnpoint any" goes back to unconditional; "spawnpoint none" is a
// new game or a direct "map base2".
//
// Commented out so the map looks exactly as it did - fill in and uncomment.
//
spawnpoint base1                    // walked in from base1
mapcvar sky_map_sun_elevation -5
mapcvar sky_map_sun_azimuth 285

spawnpoint base3b                   // came back up out of base3, later in the day
mapcvar sky_map_sun_elevation 30
mapcvar sky_map_sun_azimuth 20
