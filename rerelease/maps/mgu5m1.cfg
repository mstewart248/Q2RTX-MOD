// Sky and fog override for mgu1m1.
//
// Everything here uses "mapcvar", which sets a cvar for THIS MAP ONLY and puts
// the player's own value back on the next map load. Do not use plain "set" here
// and do not add "reset" lines to maps/default.cfg for these - reset restores a
// cvar's compiled-in default, not what the player had.
//
// WHICH sky is chosen is NOT here: this map is listed in the sky_procedural_maps
// cvar, which declines its own skybox and renders the Stroggos procedural
// atmosphere instead. It has to live there rather than here because a "sky"
// command from this file cannot hold - the target_sky that this map's drop pod
// fires on landing re-issues CS_SKY*, CL_SetSky runs again, and the map's real
// skybox comes straight back.
//
// (Its real skybox is the stock unit1_ cube map, which worldspawn falls back to
// because it names no sky of its own - a blue Earth sky over a map whose own
// _sunlight_color and heightfog are orange.)

// WHERE the sun sits. These two are copied into sun_elevation / sun_azimuth
// once, on map load, and only while the sun preset is Custom - so they are a
// starting point, not a lock. Move the sun in the video menu afterwards and it
// stays where you put it; select any time-of-day preset and these are ignored
// and that preset is honoured exactly as on any other map.
//
// Chosen by eye with the sky held still. Do not read anything into the map's own
// _sun_mangle "30 -70 0" - that is what the lightmap compiler was aimed with,
// and it is not where this sun looks right.

// Sunlight fog. This map carries heightfog_density 0.00025 over a band from
// z -714 to z +404, and no distance fog at all.
mapcvar cl_fog 3
mapcvar pt_fog_light_scale 2.0
mapcvar cl_fog_scale 4.0
mapcvar pt_fog_light_shadow 0.0
mapcvar pt_fog_light_falloff 4
mapcvar pt_fog_light_knee .15
mapcvar pt_fog_sky_scale 3.2
mapcvar cl_dynamic_lights 0
mapcvar pt_sky_brightness .005
mapcvar pt_sky_light_scale .2
