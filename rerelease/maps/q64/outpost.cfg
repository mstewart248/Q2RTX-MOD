// Sky override for q64/outpost, the first map of the Quake II 64 episode.
//
// Matt, 2026-11-07: "sets the sky to earth at dawn if you have rerelease
// selected as the sky".
//
// Everything here uses "mapcvar", which sets a cvar for THIS MAP ONLY and puts
// the player's own value back on the next map load. Do not use plain "set" here
// and do not add "reset" lines to maps/default.cfg for these.
//
// All three lines only take effect in the "rerelease" sky type (sky_type 0).
// Any other sky type is the player asking for one particular sky everywhere,
// and the map does not overrule that - see sky_mode_is_rerelease in
// physical_sky.c.

// WHICH sky: the procedural Earth atmosphere instead of the map's own skybox
// (worldspawn names the stock unit1_ cube map).
mapcvar use_procedural_sky earth

// WHERE the sun sits: the video menu's "dawn" time of day exactly - the sun
// just below the horizon (SUN_PRESET_DAWN in physical_sky.c). Copied into
// sun_elevation / sun_azimuth on every load of this map, as a starting point:
// move the sun afterwards and it stays where you put it. The azimuth is the
// preset's, not chosen against this map's openings; retune it here if the
// glow comes from the wrong side.
mapcvar sky_map_sun_elevation -3
mapcvar sky_map_sun_azimuth 0
