// [rerelease] Cooling Facility - cool1
//
// LIVE TIME OF DAY. This map states no hour of its own: the sun runs the whole
// day/night cycle while you play it, one full turn every ~86 minutes. The maps
// that DO state an hour - base1, base2, base3, bunk1 and ware1 - carry
// sky_map_sun_elevation / _azimuth instead and are deliberately not listed here,
// as are the two space levels, boss2 and space.
//
// Both lines below are needed and neither works without the other:
//
//   use_procedural_sky  declines this map's own unit6_ cube map and renders the
//                       Stroggos atmosphere, which is the only sky that HAS a
//                       sun to move. Without it the cube map just sits there.
//   sky_map_sun_animate the rate, and permission to ignore the player's
//                       time-of-day preset - which is Morning by default, and
//                       every preset but Custom is a FIXED sun. This is why a
//                       plain "mapcvar sun_animate 1" would do nothing.
//
// Both only bite in "rerelease" sky mode; pick a sky explicitly in the video
// menu and this map's opinion is dropped. See physical_sky.c.
mapcvar use_procedural_sky stroggos
mapcvar sky_map_sun_animate 1

// Fog brightness for this map - the five fog-menu knobs, overriding the
// player's own for this map only. Converted from the old cl_fog_scale /
// cl_volumetric_fog_density recipe so the map keeps the look it was tuned to;
// see the conversion note in src/client/mapfog.c. Fog on/off stays the player's.
mapcvar pt_fog_scale_sun 10
mapcvar pt_fog_scale_skybox 2.5
mapcvar pt_fog_scale_emissive 2.5
mapcvar pt_fog_scale_dynamic 2.5
mapcvar pt_fog_scale_model 2.5
mapcvar cl_dynamic_lights 0
mapcvar pt_fog_step 8
