// Every Quake 1 map, before its own maps/q1/<map>.cfg (vkpt main.c: map names
// starting q1/). mapcvar: the player's own value comes back on the next map,
// and a map's own cfg can still override any of these.
//
// FOG BRIGHTNESS LIKE THE RERELEASE QUAKE II MAPS (Matt, 2026-11-21: "these
// maps should have fog volumes like the rerelease quake2 maps"). How bright
// the fog is comes only from the five pt_fog_scale_* knobs - the map's own fog
// density is normalised to shape alone (src/client/mapfog.c), and a Quake 1
// fog is a flat distance fog with no shape, so it rendered at the player's
// defaults (0.2) and barely showed. Each rerelease map cfg raises the knobs
// for its map; these are the MEDIANS of those 51 cfgs (rerelease/maps/*.cfg).
// Not tuned by eye yet - raise or lower to taste here, or per map.
//
// the map's own sun (_sun_mangle; 44 maps, see physical_sky.c THE QUAKE 1 SUN)
mapcvar pt_fog_scale_sun 6.5
// glowing textures
mapcvar pt_fog_scale_emissive 1.6
// the map's light entities and placed lights (maps/lights/q1/*.cfg)
mapcvar pt_fog_scale_dynamic 1.4
// torches, flames
mapcvar pt_fog_scale_model 1.4
// pt_fog_scale_skybox is left alone: a Quake 1 sky's fog term is also scaled
// by pt_q1_sky_fog (maps/q1/start.cfg sets 15 against the player's 0.01).
